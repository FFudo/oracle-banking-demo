services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${SYSTEM_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 5s
    volumes:
      - ./:/workspace:ro
      - oradata:/opt/oracle/oradata

volumes:
  oradata:
